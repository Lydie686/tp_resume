---
- name: Hardening de la securite systeme Linux
  hosts: dev
  become: true
  tasks:

    - name: Desactiver la connexion SSH en Root
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PermitRootLogin'
        line: 'PermitRootLogin no'
        state: present
      notify: Redemarrer SSH

    - name: Desactiver l'authentification SSH par mot de passe
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PasswordAuthentication'
        line: 'PasswordAuthentication no'
        state: present
      notify: Redemarrer SSH

    - name: Securiser les permissions du fichier /etc/shadow
      ansible.builtin.file:
        path: /etc/shadow
        owner: root
        group: root
        mode: '0000'

  handlers:
    - name: Redemarrer SSH
      ansible.builtin.service:
        name: sshd
        state: restarted
