name: Ansible CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Recupérer le code du dépôt
        uses: actions/checkout@v3

      - name: Configurer Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Installer Ansible et Ansible-Lint
        run: |
          python -m pip install --upgrade pip
          pip install ansible ansible-lint

      - name: Executer l'analyse de code (ansible-lint)
        run: |
          ansible-lint playbook.yml
